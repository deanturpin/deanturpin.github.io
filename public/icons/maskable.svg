<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Full bleed for launchers that crop to their own shape; the bars are
       scaled into the central safe zone so no mask clips them -->
  <rect width="64" height="64" fill="#d95926"/>
  <g fill="#fff" transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <rect x="12" y="30" width="6" height="22" rx="3"/>
    <rect x="22" y="18" width="6" height="34" rx="3"/>
    <rect x="32" y="12" width="6" height="40" rx="3"/>
    <rect x="42" y="24" width="6" height="28" rx="3"/>
  </g>
</svg>
